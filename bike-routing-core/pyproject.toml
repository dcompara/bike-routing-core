[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "brcore"
version = "0.1.0"
description = "Bike routing core: compact graph IO + preprocessing artifacts + routing algorithms"
requires-python = ">=3.10"
dependencies = [
  "numpy",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
